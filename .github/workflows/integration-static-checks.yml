name: Mid-360 integration static checks

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check integration contract and Python syntax
        run: python -m unittest discover -s tests -v
